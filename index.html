<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kumo Supply</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#c8102e;--ok:#1b7f4b;--br:#2f7f99;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--tx:#f0efe9;--mu:#a3a198;--bd:#363532;--ac:#ff5a6e;--ok:#4cc98a;--br:#6cc3dd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--tx:#f0efe9;--mu:#a3a198;--bd:#363532;--ac:#ff5a6e;--ok:#4cc98a;--br:#6cc3dd;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:580px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
h1{font-size:20px;margin:6px 0 0}.logo{height:46px;width:auto;color:var(--tx);overflow:visible}
.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.lang{display:flex;gap:4px}
.lang button{padding:6px 9px;font-size:13px;margin:0}
.lang button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;margin-top:4px;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.it{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.del{color:var(--ac);align-self:end}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.row span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.tot{font-size:22px;font-weight:700;color:var(--ac);border:0}
.btns{display:grid;gap:8px;margin-top:12px}
.btns a,.btns button{display:block;text-align:center;text-decoration:none;color:#fff;background:var(--ac);border:0;padding:12px;border-radius:10px;font-weight:600}
.btns .alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.note{font-size:12px;color:var(--mu);margin-top:8px}
.warn{background:rgba(200,16,46,.1);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
#cat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{border:1px solid var(--bd);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}.pc img{width:100%;border-radius:8px}.ph{aspect-ratio:4/5;display:grid;place-items:center;font-size:40px;background:var(--bg);border-radius:8px}.pn{font-size:14px;font-weight:600}.pp{color:var(--ac);font-weight:700}.pc button{margin-top:auto;background:var(--ac);color:#fff;border:0}
.dimg{width:100%;max-width:380px;display:block;margin:0 auto 10px;border-radius:12px}.dd{white-space:pre-wrap;margin:8px 0}
button,.btns a{position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .2s ease,filter .2s ease,background-color .2s}
button:hover,.btns a:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18);filter:brightness(1.06)}
button:active,.btns a:active{transform:translateY(0) scale(.95);box-shadow:none}
button.ok{background:var(--ok)!important}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
.pc{transition:transform .2s ease,box-shadow .2s ease}.pc:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.15)}
.pc img{transition:transform .35s ease}.pc:hover img{transform:scale(1.04)}
.card{animation:up .5s ease both}.card:nth-of-type(even){animation-delay:.08s}
.it{animation:pop .3s ease both}.tot{animation:tick .3s ease}
.cloud{animation:bob 3.2s ease-in-out infinite}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:none;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#fab.b{animation:bump .4s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes tick{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{padding:7px 14px;border-radius:999px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#adm{display:none}
#adm.on{display:block}
.pr{color:var(--ok);font-weight:600}
</style></head><body><main>
<header><svg class="logo" id="logo" viewBox="0 0 150 48" role="img" aria-label="Kumo Supply"><g class="cloud"><g fill="var(--br)"><circle cx="14" cy="24" r="9"/><circle cx="26" cy="16" r="11"/><circle cx="38" cy="24" r="9"/><rect x="14" y="24" width="24" height="9"/></g><path d="M17 25 q9 6 18 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></g><text x="56" y="27" font-size="23" font-weight="800" fill="currentColor" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Kumo</text><text x="57" y="42" font-size="12" font-weight="600" letter-spacing="3.2" fill="var(--br)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">SUPPLY</text></svg><div class="lang" id="lang"></div></header>
<h1 data-i="title"></h1>
<p class="sub" data-i="sub"></p>

<div class="card"><h2 data-i="dest"></h2>
<select id="dest"><option value="ID">🇮🇩 Indonesia (IDR)</option><option value="UZ">🇺🇿 Oʻzbekiston (UZS)</option><option value="RU">🇷🇺 Россия (RUB)</option></select></div>

<div class="card" id="catc"><h2 data-i="cat"></h2><div class="tabs" id="tabs"></div><div id="cat"></div></div>
<div class="card" id="det" style="display:none"></div>
<div class="card" id="cartc"><h2 data-i="cart"></h2><div id="list"></div>
<button type="button" id="add" data-i="add"></button>
<div class="warn" data-i="warn"></div></div>

<div class="card"><h2 data-i="you"></h2><div class="g">
<label><span data-i="cname"></span><input id="cn" autocomplete="name"></label>
<label><span data-i="wapp"></span><input id="cw" type="tel" autocomplete="tel" placeholder="+62 ..."></label>
<label><span data-i="contact"></span><input id="cc" placeholder="@telegram"></label>
<label><span data-i="mail"></span><input id="ce" type="email" autocomplete="email"></label>
<label class="full"><span data-i="city"></span><textarea id="ad" rows="2" autocomplete="street-address"></textarea></label>
<label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rm" checked style="width:auto;margin:0"><span data-i="rem"></span></label>
<div class="warn full" id="verr" style="display:none"></div></div></div>

<div class="card"><h2 data-i="sum"></h2><div id="out"></div>
<div class="note" data-i="note"></div></div>
<div class="card"><h2 data-i="pay"></h2><div id="payb"></div><div class="note" data-i="payhint"></div>
<div class="btns"><a id="tg" target="_blank" rel="noopener"></a><a id="wa" target="_blank" rel="noopener"></a><button type="button" id="cp" class="alt"></button></div></div>

<div class="card" id="histc" style="display:none"><h2 data-i="hist"></h2><div id="hist"></div></div>
<div class="card" id="adm"><h2>Admin (#admin)</h2><div class="g">
<label>Markup %<input data-k="mk" type="number" step="any"></label>
<label>Min fee ¥<input data-k="minmk" type="number"></label>
<label>Shipping markup %<input data-k="shipmk" type="number" step="any"></label>
<label>Payment fee %<input data-k="payfee" type="number" step="any"></label>
<label>Ship base ¥<input data-k="base" type="number"></label>
<label>Ship ¥/kg<input data-k="rate" type="number"></label>
<label>1¥ = IDR<input data-k="fxID" type="number" step="any"></label>
<label>1¥ = UZS<input data-k="fxUZ" type="number" step="any"></label>
<label>1¥ = RUB<input data-k="fxRU" type="number" step="any"></label>
<label>Telegram (no @)<input data-k="tg"></label>
<label class="full">WhatsApp (digits only)<input data-k="wa"></label>
<label class="full">Payment details: Indonesia<textarea data-k="pm_ID" rows="2"></textarea></label>
<label class="full">Payment details: Uzbekistan<textarea data-k="pm_UZ" rows="2"></textarea></label>
<label class="full">Payment details: Russia<textarea data-k="pm_RU" rows="2"></textarea></label></div>
<h2 style="margin-top:14px">Products</h2><div id="ap"></div><button type="button" id="np">+ Product</button>
<div class="row pr" style="margin-top:10px"><span>Profit</span><span id="pf"></span></div>
<div class="row"><span>Real shipping</span><span id="rs"></span></div>
<button type="button" id="cfg" style="margin-top:10px">Copy config</button>
<div class="note">Settings are saved only in this browser. To make them live for customers, paste the copied config and ask Claude to update CONFIG.</div></div>
<button type="button" id="fab" aria-label="Cart">🛒 <span id="fn">0</span></button>
</main>
